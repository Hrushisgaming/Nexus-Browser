name: Build Nexus for macOS (arm64)

# Run it from the Actions tab: "Build Nexus for macOS (arm64)" -> "Run workflow".
# Result: an artifact called "Nexus-arm64-dmg" on the run page (unsigned, ad-hoc signed).

on:
  workflow_dispatch:
    inputs:
      runner:
        required: false
        description: "Runner image name"
        default: "macos-latest"
      resume_run_id:
        required: false
        description: "Optional: run ID of an unfinished earlier run to continue from (the number in its URL). Leave empty for a fresh build."
        default: ""

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: Build Nexus (arm64)
    uses: ./.github/workflows/building.yml
    with:
      arch: arm64
      os: ${{ inputs.runner }}
      resume_run_id: ${{ inputs.resume_run_id }}
