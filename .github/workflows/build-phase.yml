name: Build Nexus for macOS (one phase)

defaults:
  run:
    shell: bash
    working-directory: helium-macos

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      os:
        required: true
        type: string
      resume:
        required: false
        type: boolean
        default: false
    outputs:
      status:
        value: ${{ jobs.build_job.outputs.status }}

jobs:
  build_job:
    name: Build Nexus for macOS
    runs-on: ${{ inputs.os }}
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: ./.github/actions/prepare-environment
      - name: Download resources
        if: ${{ !inputs.resume }}
        uses: actions/download-artifact@v4
        with:
          name: nexus_macos_resources_${{ inputs.arch }}
          path: helium-macos
      - name: Unpack resources
        if: ${{ !inputs.resume }}
        run: ./github_unpack_resources.sh
      - name: Prepare for building
        if: ${{ !inputs.resume }}
        run: |
          set -o pipefail
          source ./devutils/shared.sh
          configure_build '${{ inputs.arch }}' true true | tee -a github_actions_build_${{ inputs.arch }}.log
      - name: Get previous logs
        if: ${{ inputs.resume }}
        uses: actions/download-artifact@v4
        with:
          name: github_build_logs_${{ inputs.arch }}
          path: helium-macos
      - name: Download build
        if: ${{ inputs.resume }}
        uses: actions/download-artifact@v4
        with:
          name: github_build_artifact_${{ inputs.arch }}
          path: helium-macos
      - name: Unpack archive of build
        if: ${{ inputs.resume }}
        run: ./github_unpack_archive.sh
      - uses: ./.github/actions/do-build
        id: build
        with:
          arch: ${{ inputs.arch }}
