name: Build Nexus
inputs:
  arch:
    required: true
    type: string
outputs:
  status:
    value: ${{ steps.build.outputs.status }}
runs:
  using: composite
  steps:
    - name: Show sccache stats before build
      run: sccache --show-stats
      shell: bash
      working-directory: helium-macos

    - name: Build
      id: build
      run: |
        set -o pipefail
        ./github_build.sh '${{ inputs.arch }}' 2>&1 | tee -a github_actions_build_${{ inputs.arch }}.log
      shell: bash
      working-directory: helium-macos

    - name: Show sccache stats after build
      run: sccache --show-stats
      shell: bash
      working-directory: helium-macos

    - name: Pack the build (and make the Nexus dmg if the build finished)
      id: bake
      run: |
        set -o pipefail
        ./github_prepare_artifacts.sh '${{ inputs.arch }}' | tee -a github_actions_upload_${{ inputs.arch }}.log
      shell: bash
      working-directory: helium-macos

    - name: Upload part build artifact
      uses: actions/upload-artifact@v4
      with:
        name: github_build_artifact_${{ inputs.arch }}
        path: helium-macos/upload_part_build/
        overwrite: true
    - name: Upload logs
      uses: actions/upload-artifact@v4
      with:
        name: github_build_logs_${{ inputs.arch }}
        path: helium-macos/upload_logs/
        overwrite: true
    - name: Upload Nexus dmg
      if: ${{ steps.build.outputs.status == 'finished' }}
      uses: actions/upload-artifact@v4
      with:
        name: Nexus-${{ inputs.arch }}-dmg
        path: |
          helium-macos/release_asset/${{ steps.bake.outputs.file_name }}
          helium-macos/${{ steps.bake.outputs.file_name }}.sha256.txt
        if-no-files-found: error
