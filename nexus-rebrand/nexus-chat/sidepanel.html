<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Chat with Nexus</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="sidepanel.css"></head>
<body>
  <header>
    <img src="icons/glyph.png" alt="" width="24" height="24">
    <h1>Chat with Nexus</h1>
    <button id="bNew" title="New chat" aria-label="New chat">New</button>
    <button id="bHist" title="Chat history" aria-label="Chat history">History</button>
    <button id="bPop" title="Open in its own window" aria-label="Pop out">Pop out</button>
    <button id="bSet" title="Settings" aria-label="Settings">Settings</button>
  </header>
  <nav id="tabs" aria-label="Chat source"></nav>
  <section id="paneChat" class="pane">
    <div id="msgs" aria-live="polite"></div>
    <footer>
      <div id="chips"></div>
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Message Nexus" aria-label="Message"></textarea>
        <button id="bSend" class="send" aria-label="Send">Send</button>
      </div>
    </footer>
  </section>
  <section id="paneWeb" class="pane"><div id="webbar"></div><div id="frames"></div></section>
  <section id="paneHist" class="pane scroll"></section>
  <section id="paneSet" class="pane scroll"></section>
  <div id="toasts"></div>
  <script type="module" src="sidepanel.js"></script>
</body></html>
